function loadSound(key, file, volume=1.0, loop=false, poolSize=1) {
  if(poolSize > 1) {
    const pool = [];
    for(let i=0; i<poolSize; i++){
      const a = new Audio(file);
      a.volume = volume;
      a.baseVolume = volume;
      a.loop = loop;
      a.onerror = ()=>{};
      pool.push(a);
    }
    pool.index = 0;
    SND[key] = pool;
  } else {
    const a = new Audio(file); a.volume=volume; a.baseVolume=volume; a.loop=loop; a.onerror=()=>{}; SND[key]=a;
  }
}

/* ======================================================================
   LEVEL 1–100 DIFFICULTY SYSTEM  (NEW — centralized, single source of truth)
   ----------------------------------------------------------------------
   Everything that scales with level (enemy HP/speed, spawn rate, bullet
   speed/count, boss stats, meteor speed, obstacle chance, formation size,
   max simultaneous enemies) is computed HERE ONLY, from one smooth eased
   curve. Nowhere else in the file should there be a raw "if(level>30)"
   style branch for difficulty — every consumer just calls
   getDifficulty(level) and reads the fields it needs.

   Curve shape: quadratic-ish ease-out (fast early progress, tapering
   growth toward level 100) so that:
     - Level 1        → very easy, teaches the game
     - Level 20       → already medium
     - Level 50       → hard
     - Level 75       → very hard
     - Level 100      → maximum, but every value is hard-capped so it
                         never becomes literally unplayable ("absurd").
   Because the curve is continuous (no per-tier jumps), boss levels
   (5,10,...,100) never feel like a sudden 2-3x spike versus the level
   right before them — see bossMultiplier/bossHP etc. below, which are
   evaluated on the exact same smooth curve.

   TO RE-TUNE DIFFICULTY LATER: only edit the constants inside this
   function. Nothing else needs to change.
   ====================================================================== */
const DIFFICULTY_MAX_LEVEL=100;
function easeOutPow(t,p){return 1-Math.pow(1-t,p);}
function getDifficulty(level){
  const lv=Math.max(1,Math.min(DIFFICULTY_MAX_LEVEL,level));
  const t=(lv-1)/(DIFFICULTY_MAX_LEVEL-1);      // 0 at level1, 1 at level100
  const ease=easeOutPow(t,2.0);                  // NEW: nudged up slightly (was 2.3) — a touch more challenge

  // --- regular enemies ---
  const enemyHP           = Math.round(6+20*ease);                        // 6   -> 26
  const enemySpeed        = Math.min(3.6, 1.6+1.8*ease);                  // 1.6 -> 3.4  (slightly harder)
  const spawnInterval     = Math.max(650, Math.round(1500-820*ease));     // 1500-> 680ish
  const enemyBulletSpeed  = Math.min(8.4, 5.5+2.7*ease);                  // 5.5 -> 8.2
  const enemyFireDelay    = Math.max(750, Math.round(1400-600*ease));     // 1400-> 800ish
  const bulletsPerVolley  = Math.min(2, 1+Math.floor(1*ease+0.35));       // 1   -> 2    (hard cap)
  const shotsCap          = Math.min(6, 2+Math.round(4*ease));            // 2   -> 6    (finite engagement window)
  const maxEnemies        = Math.min(MAX_ENEMIES, Math.round(5+3*ease));  // 5   -> 8    (respects MAX_ENEMIES hard cap)
  const obstacleChance    = Math.min(0.11, 0.04+0.07*ease);               // 0.04-> 0.11
  const shooterFormationSize = Math.max(1, Math.min(5, 1+Math.round(3.5*ease))); // 1 -> 5 (starts SOLO, not forced groups)

  // --- boss (levels 5,10,...,100) ---
  const bossHP            = Math.round(140+460*ease);                    // 140 -> 600
  const bossSpeed         = Math.min(3.0, 1.6+1.4*ease);                 // 1.6 -> 3.0
  const bossFireInterval  = Math.max(700, Math.round(1350-650*ease));    // 1350-> 700
  const bossBulletCount   = Math.min(12, 3+Math.round(8*ease));          // 3   -> 11   (hard cap)
  const bossMultiplier    = 1.0+0.55*ease;                                // reference multiplier for tuning
  const bossEnrageCapable = lv>=45;                                      // phase/enrage mechanic unlocks Boss45+
  const bossEnrageFireMult= 0.8-0.15*ease;                                // enrage fires somewhat faster, not brutally

  // --- meteor levels (4,9,...,99) ---
  const meteorSpeed = Math.min(4.7, 3.0+1.7*ease);                       // 3.0 -> 4.7  (hard cap, always dodgeable)

  return{
    ease, enemyHP, enemySpeed, spawnInterval, enemyBulletSpeed, enemyFireDelay,
    bulletsPerVolley, shotsCap, maxEnemies, obstacleChance, shooterFormationSize,
    bossHP, bossSpeed, bossFireInterval, bossBulletCount, bossMultiplier,
    bossEnrageCapable, bossEnrageFireMult, meteorSpeed
  };
}
/* =================== END LEVEL 1–100 DIFFICULTY SYSTEM =================== */

function generateRoomPathFrac(n,columns){
  const rows=Math.ceil(n/columns);
  const pts=[];
  for(let i=0;i<n;i++){
    const row=Math.floor(i/columns);
    let col=i%columns;
    if(row%2===1) col=columns-1-col;
    const yFrac = rows>1 ? (0.92 - row*(0.80/(rows-1))) : 0.5;
    const xFrac = columns>1 ? (0.14 + col*((1-0.28)/(columns-1))) : 0.5;
    pts.push({x:xFrac,y:yFrac});
  }
  return pts;
}

const ROOM_STARTS=(()=>{const s=[];let acc=1;for(let i=0;i<ROOM_LEVEL_COUNTS.length;i++){s.push(acc);acc+=ROOM_LEVEL_COUNTS[i];}return s;})();

  const count=roomLevelCount(currentRoom);

}

  hitEffect(x,y,color,Math.max(16,Math.min(34,rect.w*0.45)));
}

function formationOffsets(shape,n,spacing){
  const pts=[];
  if(shape==='circle'){
    const R=spacing*0.95;
    for(let i=0;i<n;i++){
      const a=i*(2*Math.PI/n)-Math.PI/2;
      pts.push({dx:Math.cos(a)*R,dy:Math.sin(a)*R*0.6});
    }
  }else if(shape==='square'){
    const R=spacing*0.95;
    for(let i=0;i<n;i++){
      const a=(i/n)*2*Math.PI-Math.PI/4;
      let cx=Math.cos(a),cy=Math.sin(a);
      const m=Math.max(Math.abs(cx),Math.abs(cy))||1;
      cx/=m;cy/=m;
      pts.push({dx:cx*R,dy:cy*R*0.6});
    }
  }else if(shape==='triangle'){
    const rows=[];let remaining=n,r=1;
    while(remaining>0){const c=Math.min(r,remaining);rows.push(c);remaining-=c;r++;}
    let y=-((rows.length-1)/2)*spacing*0.85;
    for(const count of rows){
      for(let i=0;i<count;i++)pts.push({dx:(i-(count-1)/2)*spacing,dy:y});
      y+=spacing*0.85;
    }
  }else{
    for(let i=0;i<n;i++)pts.push({dx:(i-(n-1)/2)*spacing,dy:0});
  }
  return pts;
}

function buildFormation(shape,n,desiredSpacing){
  let spacing=desiredSpacing;
  let offsets=formationOffsets(shape,n,spacing);
  let maxDx=Math.max(1,...offsets.map(o=>Math.abs(o.dx)));
  let maxDy=Math.max(1,...offsets.map(o=>Math.abs(o.dy)));
  const halfW=(W-40)/2;
  const halfH=(H*0.4-60)/2;
  const scale=Math.min(1, halfW/maxDx, halfH/maxDy);
  if(scale<1){
    spacing*=scale;
    offsets=formationOffsets(shape,n,spacing);
    maxDx=Math.max(1,...offsets.map(o=>Math.abs(o.dx)));
    maxDy=Math.max(1,...offsets.map(o=>Math.abs(o.dy)));
  }
  const minCX=20+maxDx, maxCX=W-20-maxDx;
  const centerX=minCX<=maxCX ? (minCX+Math.random()*(maxCX-minCX)) : W/2;
  const minCY=60+maxDy, maxCY=H*0.4-maxDy;
  const centerY=minCY<=maxCY ? (minCY+Math.random()*(maxCY-minCY)) : (60+(H*0.4-60)/2);
  return{offsets,centerX,centerY};
}

function spawnEntities(){
  const lv=currentLevel;
  const diff=getDifficulty(lv);   // NEW: single source of truth for this level's difficulty
  if(giantMeteors.length)return;

  // The small black asteroids fall in every level, from level 1 onward.
  // Their x position is randomized once at spawn and never changes, so
  // their path is always straight down instead of zigzagging.
  // Only the large debris remains, and it appears occasionally.
  const obstacleInterval=gameSettings.meteorRate===2?4500:7000;
  if(obstacles.length<1&&now()-lastObstacle>obstacleInterval){
    obstacles.push(createObstacle(lv));
    lastObstacle=now();
  }

  // enemy.png must continue falling even on boss levels. Keep this
  // separate from the normal shooter wave so every level gets it.
  const rusherCount=enemies.filter(e=>e.mode==='rusher').length;
  const rusherCap=Math.min(3,diff.maxEnemies);
  const rusherInterval=gameSettings.meteorRate===2?900:1450;
  if(enemies.length<diff.maxEnemies&&rusherCount<rusherCap&&now()-lastRusher>rusherInterval){
    const rTargetX=Math.floor(Math.random()*Math.max(1,W-RU_W));
    enemies.push(createEnemy('rusher',lv,'top',rTargetX,0));
    lastRusher=now();
  }

  if(lv%5===0&&bosses.length===0 && !giantMeteors.length){bosses.push(createBoss(lv));}

  const baseDelay = diff.spawnInterval;
    if(bosses.length===0&&now()-lastSpawn>baseDelay){
    const hardCap=diff.maxEnemies;
    const capacity=hardCap-enemies.length;
    if(capacity>=1){
      const spacingWanted=Math.max(EN_W*1.7,80);
      const maxByWidth=Math.max(2,Math.floor((W-40)/spacingWanted)+1);
      const desiredShooters=diff.shooterFormationSize;
      const shooterCount=Math.min(capacity,desiredShooters,maxByWidth);
      if(shooterCount>=2){
        const shapes=['line','circle','square','triangle'];
        const shape=shapes[waveIndex%shapes.length];
        waveIndex++;
        const sides=['top','left','right'];
        const entry=sides[Math.floor(Math.random()*sides.length)];
        const {offsets,centerX,centerY}=buildFormation(shape,shooterCount,spacingWanted);
        for(let i=0;i<shooterCount;i++){
          const off=offsets[i]||{dx:0,dy:0};
          enemies.push(createEnemy('shooter',lv,entry,centerX+off.dx,centerY+off.dy));
        }
      }else{
        enemies.push(createEnemy('shooter',lv,'top',Math.floor(Math.random()*(W-EN_W)),-50));
      }

    }
    lastSpawn=now();
  }
}

function createEnemy(mode,lv,entry,targetX,targetY){
  const diff=getDifficulty(lv);
  const w=mode==='shooter'?EN_W:RU_W,h=mode==='shooter'?EN_H:RU_H;

  // Keep enemy rectangles inside the phone viewport, including while they
  // enter from the sides. They can still appear at the edge, but never
  // travel beyond it.
  targetX=Math.max(0,Math.min(Math.max(0,W-w),targetX));
  targetY=Math.max(0,Math.min(Math.max(0,H*0.4-h),targetY));
  let sx,sy;
  if(entry==='top'){sx=targetX;sy=0;}
  else if(entry==='left'){sx=0;sy=targetY;}
  else{sx=Math.max(0,W-w);sy=targetY;}

  const hpVal=diff.enemyHP;
  const spdVal=diff.enemySpeed;
  const entrySpeed=Math.min(7.5,3.6+diff.ease*3.5);
  const enemyShipImgs=['shooter','shooter2','shooter3','shooter4'];

  return{
    type:'enemy',mode,enemyImg:mode==='shooter'?enemyShipImgs[Math.floor(Math.random()*enemyShipImgs.length)]:'rusher',rect:{x:sx,y:sy,w,h},
    maxHp:hpVal,hp:hpVal,speed:spdVal,lv,
    startX:targetX,targetX,targetY,entry,entrySpeed,
    entered:false,holdUntil:0,spawnT:now(),lastShot:now(),
    shotsFired:0,
    fireDelay:diff.enemyFireDelay,
    bulletSpeed:diff.enemyBulletSpeed,
    bulletCount:diff.bulletsPerVolley,
    shotsCap:diff.shotsCap,
    ampSway:8+22*diff.ease,
    ampWeave:30+40*diff.ease
  };
}

function createObstacle(lv){

function startBossMeteor(nextLevel){
  const diff=getDifficulty(nextLevel);
  const size=Math.min(W*0.34,Math.max(AST_W*0.95,U*3.0)); // NEW: slightly smaller max width so the dodge gap is wider
  const speed=Math.max(2.7,diff.meteorSpeed*1.05);
  const meteorCount=3; // falls several times in a row, not just once
  const spacingY=size*2.1; // NEW: increased further — much more breathing room between each falling asteroid
  giantMeteors=[];
  for(let i=0;i<meteorCount;i++){
    // NEW: strictly alternate left/right so consecutive asteroids never spawn
    // in the same lane — always one from the right, then one from the left, etc.
    const gapOnLeft=(i%2===0);
    const x=gapOnLeft?Math.max(18,W-size-8):8;
    giantMeteors.push({rect:{x,y:-size-20-i*spacingY,w:size,h:size},speed,targetLevel:nextLevel,shakeTimer:0});
  }
  enemies=[];bosses=[];bullets=[];enemyBullets=[];obstacles=[];heals=[];shields=[];coins=[];
  levelMsg='⚠ დიდი ასტეროიდები — აიცილე!';
  msgTimer=now();
}
function updateGiantMeteor(){
  if(!giantMeteors.length)return;
  // The ship's rect has some empty/transparent padding around the actual
  // visible sprite, so using the full rect for this dodge made it collide
  // before the ship visually touched the asteroid. Use a tighter box that
  // matches what the player actually sees, instead of shrinking the asteroid.
  const hitRect=player?{
    x:player.rect.x+player.rect.w*0.20,
    y:player.rect.y+player.rect.h*0.14,
    w:player.rect.w*0.60,
    h:player.rect.h*0.72
  }:null;
  for(let i=giantMeteors.length-1;i>=0;i--){
    const gm=giantMeteors[i];
    gm.rect.y+=gm.speed;
    if(player&&hitRect&&rectHit(hitRect,gm.rect)){
      shatterObject(gm.rect,'asteroid','#ff4b22');
      giantMeteors=[];
      player.hp=0;
      playSound('gameover');stopMusic();stopLaserSound();state='gameover';
      return;
    }
    if(gm.rect.y>H+gm.rect.h){
      shatterObject(gm.rect,'asteroid','#ff9b3d');
      giantMeteors.splice(i,1);
      if(giantMeteors.length===0){
        levelMsg='ბოსი შემოდის!';
        msgTimer=now();
      }
    }
  }
}
function clampEntityRect(r){
  r.x=Math.max(0,Math.min(Math.max(0,W-r.w),r.x));
  r.y=Math.max(0,Math.min(Math.max(0,H-r.h),r.y));
}
function keepEnemyDistance(){
  const gap=Math.max(8,Math.floor(U*0.18));
  for(let i=0;i<enemies.length;i++){
    for(let j=i+1;j<enemies.length;j++){
      const a=enemies[i].rect,b=enemies[j].rect;
      const dx=(b.x+b.w/2)-(a.x+a.w/2),dy=(b.y+b.h/2)-(a.y+a.h/2);
      const overlapX=(a.w+b.w)/2+gap-Math.abs(dx);
      const overlapY=(a.h+b.h)/2+gap-Math.abs(dy);
      if(overlapX>0&&overlapY>0){
        if(overlapX<=overlapY){
          const push=(dx>=0?1:-1)*overlapX/2;
          a.x-=push;b.x+=push;
        }else{
          const push=(dy>=0?1:-1)*overlapY/2;
          a.y-=push;b.y+=push;
        }
        clampEntityRect(a);clampEntityRect(b);
      }
    }
  }
}
function createHeal(x,y){return{rect:{x:x-HE_W/2,y:y-HE_H/2,w:HE_W,h:HE_H}};}
function createShield(x,y){return{rect:{x:x-SH_W/2,y:y-SH_H/2,w:SH_W,h:SH_H}};}
function createCoin(x,y){return{rect:{x:x-CO_W/2,y:y-CO_H/2,w:CO_W,h:CO_H}};}
function createBullet(x,y,vy,vx,type,dmg,pierce,icon){
  const bulletIcon=icon||'pbullet';
  const isRocket=bulletIcon==='rocket',isRapid=bulletIcon==='speedshooter';
  const w=type==='player'?(isRocket?Math.floor(U*0.62):isRapid?Math.floor(U*0.54):PB_W):EB_W;
  const h=type==='player'?(isRocket?Math.floor(U*0.95):isRapid?Math.floor(U*0.82):PB_H):EB_H;
  return{rect:{x:x-w/2,y:y-h,w,h},vy,vx,type,dmg:dmg||2,pierce:!!pierce,icon:bulletIcon};
}

    for(const b of bosses){b.hp=Math.max(1,b.hp-55);hitEffect(b.rect.x+b.rect.w/2,b.rect.y+b.rect.h/2,'#ffcf4a',28);}
    hitEffect(cx,cy,'#ffcf4a',34);

    hitEffect(cx,cy,'#8ffcff',28);
  }
  playSound('levelup');vibrate(45);
}

function fireLaser(cx,cy,dmg,doDamage){
  const halfW=Math.max(6,Math.floor(PB_W*1.3));
  laserBeams=[{x:cx,y1:cy,life:3,maxLife:3}];
  if(!doDamage)return;

  for(let oi=obstacles.length-1;oi>=0;oi--){
    const o=obstacles[oi];
    if(o.rect.x<cx+halfW&&o.rect.x+o.rect.w>cx-halfW){shatterObject(o.rect,'bomb','#ff9b55');obstacles.splice(oi,1);}
  }
  for(let ei=enemies.length-1;ei>=0;ei--){
    const e=enemies[ei];
    if(e.rect.x<cx+halfW&&e.rect.x+e.rect.w>cx-halfW){
      e.hp-=dmg;
      if(e.hp<=0){
        shatterObject(e.rect,e.enemyImg||'rusher','#ff5000');
        playSound('explode');
        const dropRoll=Math.random();
        if(dropRoll<0.44)heals.push(createHeal(e.rect.x+e.rect.w/2,e.rect.y+e.rect.h/2));
        else if(dropRoll<0.74)shields.push(createShield(e.rect.x+e.rect.w/2,e.rect.y+e.rect.h/2));
        else if(dropRoll<0.94)coins.push(createCoin(e.rect.x+e.rect.w/2,e.rect.y+e.rect.h/2));
        score++;totalScore++;enemies.splice(ei,1);
      }
    }
  }
  for(let bi2=bosses.length-1;bi2>=0;bi2--){
    const b=bosses[bi2];
    if(b.rect.x<cx+halfW&&b.rect.x+b.rect.w>cx-halfW){
      b.hp-=dmg;
      if(b.hp<=0){
        shatterObject(b.rect,'boss','#ffff00');
        playSound('boss_explode');
        coinBalance+=BOSS_KILL_REWARD;saveCoins(coinBalance);
        bosses.splice(bi2,1);
        if(currentLevel===100){stopLaserSound();state='win';msgTimer=now();}else{score=0;unlockLevel(currentLevel+1);currentLevel++;}
      }
    }
  }
}

function updateGame(){
  const t=now();
  updateGiantMeteor();
  if(state==='gameover')return;
  if(player){
    // Clamp by the actual sprite bounds, not by a fixed 30px margin.
    // This keeps the whole ship on-screen on small phones and after resize.
    const halfW=player.rect.w/2,halfH=player.rect.h/2;
    const minX=halfW,maxX=Math.max(halfW,W-halfW);
    const minY=Math.max(halfH,Math.min(H-halfH,player.zoneTop));
    const maxY=Math.max(minY,H-halfH);
    const tx=Math.max(minX,Math.min(maxX,touchX)),ty=Math.max(minY,Math.min(maxY,touchY));
    const follow=0.24;
    player.rect.x+=(tx-(player.rect.x+PL_W/2))*follow;
    player.rect.y+=(ty-(player.rect.y+PL_H/2))*follow;
    player.rect.x=Math.max(0,Math.min(W-PL_W,player.rect.x));
    player.rect.y=Math.max(minY-halfH,Math.min(H-PL_H,player.rect.y));
    const wpn=getEquippedWeapon();
    const shipCfg=SHIPS.find(s=>s.id===equippedShip)||SHIPS[0];
    let shotDelay=wpn.delay, shotDmg=wpn.damage;
    if(shipCfg.power){
      if(shipCfg.power.type==='rapid')shotDelay=Math.floor(shotDelay*shipCfg.power.mult);
      if(shipCfg.power.type==='damage')shotDmg=shotDmg+shipCfg.power.bonus;
    }
    if(player.powerActiveUntil>t&&equippedShip==='ship2')shotDelay=Math.floor(shotDelay*0.5);
    if(wpn.id==='rocket'){
      stopLaserSound();
      if(t-player.lastShot>shotDelay){
        const cx=player.rect.x+PL_W/2,cy=player.rect.y;
        bullets.push(createBullet(cx,cy,12,0,'player',shotDmg,false,'rocket'));
        playSound('shoot');
        player.lastShot=t;
      }
    }else{
      stopLaserSound();
      if(t-player.lastShot>shotDelay){
      const cx=player.rect.x+PL_W/2,cy=player.rect.y;
      if(spreadMode){
        for(const ax of[-0.20,-0.07,0.07,0.20])bullets.push(createBullet(cx,cy,14,Math.floor(ax*8),'player',shotDmg,wpn.pierce,wpn.icon));
        playSound('shoot');
      }else if(shipCfg.power&&shipCfg.power.type==='twin'){
        bullets.push(createBullet(cx,cy,16,Math.floor(-shipCfg.power.gap*8),'player',shotDmg,wpn.pierce,wpn.icon));
        bullets.push(createBullet(cx,cy,16,Math.floor(shipCfg.power.gap*8),'player',shotDmg,wpn.pierce,wpn.icon));
        playSound('shoot');
      }else if(shipCfg.power&&shipCfg.power.type==='triple'){
        bullets.push(createBullet(cx,cy,16,0,'player',shotDmg,wpn.pierce,wpn.icon));
        bullets.push(createBullet(cx,cy,16,Math.floor(-shipCfg.power.spreadAngle*8),'player',shotDmg,wpn.pierce,wpn.icon));
        bullets.push(createBullet(cx,cy,16,Math.floor(shipCfg.power.spreadAngle*8),'player',shotDmg,wpn.pierce,wpn.icon));
        playSound('shoot');
      }else{
        bullets.push(createBullet(cx,cy,16,0,'player',shotDmg,wpn.pierce,wpn.icon));
        playSound('shoot');
      }
      player.lastShot=t;
      }
    }
  }
  
  spawnEntities();

  bullets=bullets.filter(b=>{b.rect.y-=b.vy;b.rect.x+=b.vx;return b.rect.y+b.rect.h>0&&b.rect.y<H&&b.rect.x+b.rect.w>0&&b.rect.x<W;});
  enemyBullets=enemyBullets.filter(b=>{b.rect.y-=b.vy;b.rect.x+=b.vx;return b.rect.y+b.rect.h>0&&b.rect.y<H&&b.rect.x+b.rect.w>0&&b.rect.x<W;});

  enemies=enemies.filter(e=>{
    const lv=e.lv,t2=now();
    if(!e.entered){
      const dx=e.targetX-e.rect.x, dy=e.targetY-e.rect.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<=e.entrySpeed){
        e.rect.x=e.targetX;e.rect.y=e.targetY;e.entered=true;
        e.holdUntil=(e.mode==='shooter')?(t2+900+Math.random()*500):0;
      }else{
        e.rect.x+=dx/dist*e.entrySpeed;
        e.rect.y+=dy/dist*e.entrySpeed;
      }
      return true;
    }
    if(e.mode==='rusher'&&t2<e.holdUntil)return true;
    if(e.mode==='shooter'){
      if(t2-e.spawnT>9000)return false;
      // Shooters are allowed to descend below the middle of the phone,
      // but stop before the lower player-control area.
      const shooterFloor=Math.max(60,Math.min(H-e.rect.h,H*0.58-e.rect.h));
      if(e.rect.y<shooterFloor)e.rect.y+=Math.max(0.8,e.speed*0.35);
      if(e.shotsFired<e.shotsCap && t2-e.lastShot>e.fireDelay){
        const n=e.bulletCount, cx=e.rect.x+e.rect.w/2, cy=e.rect.y+e.rect.h;
        for(let i=0;i<n;i++){
          const ox=(i-(n-1)/2)*0.12;
          enemyBullets.push(createBullet(cx,cy, -e.bulletSpeed, ox*5, 'enemy'));
        }
        playSound('enemy_shoot');
        e.lastShot=t2;
        e.shotsFired++;
      }
    }else{
      // enemy.png is a round black falling enemy: no zigzag or side drift.
      e.rect.y+=e.speed+1.0;
      e.rect.x=Math.max(0,Math.min(Math.max(0,W-e.rect.w),e.rect.x));
      if(e.rect.y+e.rect.h>=H){e.rect.y=Math.max(0,H-e.rect.h);return false;}
    }
    return true;
  });
  keepEnemyDistance();

  bosses=bosses.filter(b=>{
    b.rect.x+=b.speed*b.dir;
    if(b.rect.x+b.rect.w>W){b.rect.x=W-b.rect.w;b.dir=-1;}
    if(b.rect.x<0){b.rect.x=0;b.dir=1;}

    if(b.enrageCapable && !b.enraged && b.hp<=b.maxHp*0.5){
      b.enraged=true;   // NEW: boss "phase" mechanic (levels 45+) — kicks in below 50% HP
    }
    const interval = b.enraged ? Math.max(400,Math.round(b.fireInterval*b.enrageFireMult)) : b.fireInterval;
    const bulletN  = b.enraged ? Math.min(20,b.bulletCount+4) : b.bulletCount;

    const t2=now();
    if(t2-b.lastShot>interval){
      const cx=b.rect.x+b.rect.w/2, cy=b.rect.y+b.rect.h/2;
      for(let i=0;i<bulletN;i++){
        const a=i*(2*Math.PI/bulletN);
        enemyBullets.push(createBullet(cx,cy, -Math.sin(a)*3.8, Math.cos(a)*3.8, 'enemy'));
      }
      playSound('enemy_shoot');
      b.lastShot=t2;
    }
    return true;
  });

  obstacles=obstacles.filter(o=>{o.rect.y+=o.speed;return o.rect.y<H;});
  heals=heals.filter(h=>{h.rect.y+=2;return h.rect.y<H;});
  shields=shields.filter(s=>{s.rect.y+=2;return s.rect.y<H;});
  coins=coins.filter(c=>{c.rect.y+=2;return c.rect.y<H;});
  laserBeams=laserBeams.filter(lb=>{lb.life--;return lb.life>0;});

  for(let ei=enemies.length-1;ei>=0;ei--){for(let bi=bullets.length-1;bi>=0;bi--){if(rectHit(enemies[ei].rect,bullets[bi].rect)){
    const hitX=bullets[bi].rect.x+bullets[bi].rect.w/2,hitY=bullets[bi].rect.y+bullets[bi].rect.h/2;
    hitEffect(hitX,hitY,'#ffd060',12);
    const dmg=bullets[bi].dmg||2;
    if(!bullets[bi].pierce)bullets.splice(bi,1);
    enemies[ei].hp-=dmg;
    if(enemies[ei].hp<=0){
       shatterObject(enemies[ei].rect,enemies[ei].enemyImg||'rusher','#ff5000');
      playSound('explode');
      const dropRoll=Math.random();
      if(dropRoll<0.44)heals.push(createHeal(enemies[ei].rect.x+enemies[ei].rect.w/2,enemies[ei].rect.y+enemies[ei].rect.h/2));
      else if(dropRoll<0.74)shields.push(createShield(enemies[ei].rect.x+enemies[ei].rect.w/2,enemies[ei].rect.y+enemies[ei].rect.h/2));
      else if(dropRoll<0.94)coins.push(createCoin(enemies[ei].rect.x+enemies[ei].rect.w/2,enemies[ei].rect.y+enemies[ei].rect.h/2));
      score++;totalScore++;enemies.splice(ei,1);
    }
    break;
  }}}

  for(let bi2=bosses.length-1;bi2>=0;bi2--){for(let bi=bullets.length-1;bi>=0;bi--){if(rectHit(bosses[bi2].rect,bullets[bi].rect)){const hitX=bullets[bi].rect.x+bullets[bi].rect.w/2,hitY=bullets[bi].rect.y+bullets[bi].rect.h/2;hitEffect(hitX,hitY,'#fff080',16);const dmg=bullets[bi].dmg||2;if(!bullets[bi].pierce)bullets.splice(bi,1);bosses[bi2].hp-=dmg;if(bosses[bi2].hp<=0){shatterObject(bosses[bi2].rect,'boss','#ffff00');playSound('boss_explode');
    coinBalance+=BOSS_KILL_REWARD;saveCoins(coinBalance);
    bosses.splice(bi2,1);if(currentLevel===100){stopLaserSound();state='win';msgTimer=now();}else{score=0;unlockLevel(currentLevel+1);currentLevel++;}}break;}}}

  for(let oi=obstacles.length-1;oi>=0;oi--){
    for(let bi=bullets.length-1;bi>=0;bi--){
      if(rectHit(obstacles[oi].rect,bullets[bi].rect)){
        const r=obstacles[oi].rect;
        shatterObject(r,'bomb','#ff9b55');
        obstacles.splice(oi,1);
        if(!bullets[bi].pierce)bullets.splice(bi,1);
        break;
      }
    }
  }

  if(player){
    for(let hi=heals.length-1;hi>=0;hi--){if(rectHit(player.rect,heals[hi].rect)){player.hp=Math.min(PLAYER_HP,player.hp+HEAL_AMOUNT);const r=heals[hi].rect;hitEffect(r.x+r.w/2,r.y+r.h/2,'#64ff88',12);heals.splice(hi,1);playSound('heal');}}
    for(let si=shields.length-1;si>=0;si--){if(rectHit(player.rect,shields[si].rect)){player.shield=SHIELD_MAX;const r=shields[si].rect;hitEffect(r.x+r.w/2,r.y+r.h/2,'#00ffff',16);shields.splice(si,1);playSound('heal');}}
    for(let ci=coins.length-1;ci>=0;ci--){if(rectHit(player.rect,coins[ci].rect)){coinBalance+=COIN_PICKUP_VALUE;saveCoins(coinBalance);const r=coins[ci].rect;hitEffect(r.x+r.w/2,r.y+r.h/2,'#ffd700',10);coins.splice(ci,1);playSound('coin_pickup');}}
    
    let hit_=false;
    for(let ei=enemies.length-1;ei>=0;ei--){
      if(rectHit(player.rect,enemies[ei].rect)){
        hit_=true;
        const r=enemies[ei].rect;
        shatterObject(r,enemies[ei].enemyImg||'rusher','#ff6040');
        enemies.splice(ei,1);
      }
    }
    for(let oi=obstacles.length-1;oi>=0;oi--){
      if(rectHit(player.rect,obstacles[oi].rect)){
        hit_=true;
        const r=obstacles[oi].rect;
        shatterObject(r,'bomb','#ff9b55');
        obstacles.splice(oi,1);
      }
    }
    for(let bi=enemyBullets.length-1;bi>=0;bi--){
      if(rectHit(player.rect,enemyBullets[bi].rect)){
        hit_=true;
        const r=enemyBullets[bi].rect;
        hitEffect(r.x+r.w/2,r.y+r.h/2,'#ff4050',12);
        enemyBullets.splice(bi,1);
      }
    }

    const t3=now();
    if(hit_&&t3-player.lastHit>INVINCIBILITY){
      if(player.shield>0){
        player.shield-=12;
        playSound('player_hit');
        vibrate(18);
        explode(player.rect.x+player.rect.w/2,player.rect.y+player.rect.h/2,'#00ffff');
        player.lastHit=t3;
        enemyBullets=enemyBullets.filter(eb=>!rectHit(player.rect,eb.rect));
      } else {
        player.hp-=10;
        player.lastHit=t3;
        playSound('player_hit');
        vibrate(35);
        if(player.hp<=0){
          shatterObject(player.rect,getPlayerShipKey(),'#ff273d');
          playSound('gameover');stopMusic();stopLaserSound();state='gameover';return;
        }
      }
    }
  }

  const needed=30+currentLevel*3;
  if(score>=needed && currentLevel%5!==0){
    score=0;unlockLevel(currentLevel+1);currentLevel++;levelMsg=`Level ${currentLevel}!`;msgTimer=now();playSound('levelup');
    if(currentLevel%5===0)startBossMeteor(currentLevel);
  }
}

function updateEffects(){
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0;});
  debrisFragments=debrisFragments.filter(f=>{f.x+=f.vx;f.y+=f.vy;f.vy+=0.12;f.rot+=f.vr;f.life--;return f.life>0;});
  deathShatters=deathShatters.filter(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=0.16;s.rot+=s.vr;s.life--;return s.life>0;});
  impactRings=impactRings.filter(r=>{r.life--;return r.life>0;});
  screenShake*=0.82;
  if(screenShake<0.15)screenShake=0;
}
function drawRect(x,y,w,h,color,radius=0){ctx.fillStyle=color;if(radius>0&&ctx.roundRect){ctx.beginPath();ctx.roundRect(x,y,w,h,radius);ctx.fill();}else{ctx.fillRect(x,y,w,h);}}
function drawText(text,x,y,size,color,align='center',bold=false){ctx.font=`${bold?'bold ':''}${size}px Arial`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='top';ctx.fillText(text,x,y);}
function drawBtn(btn,color,text){drawRect(btn.x,btn.y,btn.w,btn.h,color,8);const fs=Math.max(9,Math.floor(btn.h*0.4));drawText(text,btn.x+btn.w/2,btn.y+(btn.h-fs)/2,fs,'#fff','center',true);}
function drawHpBar(x,y,w,h,ratio,color){drawRect(x,y,w,h,'#1e1e1e',4);if(ratio>0)drawRect(x,y,w*ratio,h,color,4);}

function drawImg(imgKey,x,y,w,h,scaleBoost=1.15){
  const img=IMG[imgKey];
  if(!img)return false;
  const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  if(!iw||!ih){ctx.drawImage(img,x,y,w,h);return true;}
  const maxW=w*scaleBoost, maxH=h*scaleBoost;
  const scale=Math.min(maxW/iw, maxH/ih);
  const dw=iw*scale, dh=ih*scale;
  const dx=x+(w-dw)/2;
  const dy=y+h-dh;
  ctx.drawImage(img,dx,dy,dw,dh);
  return true;
}
function drawSpriteStable(imgKey,x,y,w,h){
  const img=IMG[imgKey];
  if(!img)return false;
  // Gameplay sprites use one fixed box. This prevents different PNG aspect
  // ratios from making ships randomly look larger or smaller.
  const px=w*0.04,py=h*0.03;
  ctx.drawImage(img,x+px,y+py,Math.max(1,w-px*2),Math.max(1,h-py*2));
  return true;
}
function drawEffects(){
  for(const r of impactRings){
    const alpha=r.life/r.maxLife;
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.strokeStyle=r.color;
    ctx.lineWidth=Math.max(2,3*alpha);
    ctx.beginPath();
    ctx.arc(r.x,r.y,r.size*(1.6-alpha*0.6),0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  for(const p of particles){
    const alpha=p.life/p.maxLife,sz=Math.max(1,p.size*p.life/p.maxLife);
    ctx.globalAlpha=alpha;
    ctx.fillStyle=p.color;
    if(gameSettings.graphicsQuality==='high'){ctx.shadowBlur=8;ctx.shadowColor=p.color;}
    ctx.beginPath();ctx.arc(p.x,p.y,sz,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }
  for(const f of debrisFragments){
    ctx.save();
    ctx.globalAlpha=f.life/f.maxLife;
    ctx.translate(f.x,f.y);ctx.rotate(f.rot);
    ctx.fillStyle=f.color;
    if(gameSettings.graphicsQuality==='high'){ctx.shadowBlur=7;ctx.shadowColor=f.color;}
    ctx.beginPath();
    ctx.moveTo(-f.size,0);ctx.lineTo(0,-f.size*0.65);ctx.lineTo(f.size,0);ctx.lineTo(0,f.size*0.65);ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  for(const s of deathShatters){
    const partW=s.w/s.partCount,baseX=-s.w/2+s.part*partW;
    ctx.save();
    ctx.globalAlpha=s.life/s.maxLife;
    ctx.translate(s.x,s.y);ctx.rotate(s.rot);
    const img=IMG[s.imgKey];
    if(img){
      ctx.save();
      ctx.beginPath();ctx.rect(baseX,-s.h/2,partW,s.h);ctx.clip();
      ctx.drawImage(img,-s.w/2,-s.h/2,s.w,s.h);
      ctx.restore();
    }else{
      ctx.fillStyle=s.color;
      ctx.beginPath();ctx.moveTo(baseX,0);ctx.lineTo(baseX+partW/2,-s.h/2);ctx.lineTo(baseX+partW,0);ctx.lineTo(baseX+partW/2,s.h/2);ctx.closePath();ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

function drawPlayer(r){
  const shipKey=getPlayerShipKey();
  if(player && player.shield > 0) {
    const cx=r.x+r.w/2,cy=r.y+r.h/2,rad=Math.max(r.w,r.h)*0.72;
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const glow=ctx.createRadialGradient(cx,cy,Math.max(2,rad*0.25),cx,cy,rad);
    glow.addColorStop(0,'rgba(100,255,255,0.05)');
    glow.addColorStop(0.72,'rgba(40,220,255,0.18)');
    glow.addColorStop(1,'rgba(40,220,255,0)');
    ctx.fillStyle=glow;
    ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  drawSpriteStable(shipKey,r.x,r.y,r.w,r.h) || drawSpriteStable('player',r.x,r.y,r.w,r.h);
}
function drawEnemy(e){const r=e.rect,imgKey=e.enemyImg||(e.mode==='shooter'?'shooter':'rusher');drawSpriteStable(imgKey,r.x,r.y,r.w,r.h);}
function drawBoss(b){const r=b.rect;drawSpriteStable('boss',r.x,r.y,r.w,r.h);}
function drawBullet(b){
  const r=b.rect;
  if(b.type==='player'){
     const bulletScale=b.icon==='speedshooter'?1.12:b.icon==='rocket'?1.08:b.icon==='plasmagun'?1.2:1.0;
    if(!drawImg(b.icon||'pbullet',r.x,r.y,r.w,r.h,bulletScale))drawImg('pbullet',r.x,r.y,r.w,r.h,1.0);
  }else{
    drawImg('ebullet',r.x,r.y,r.w,r.h,1.0);
  }
}
function drawCoin(c){const r=c.rect;drawImg('coin',r.x,r.y,r.w,r.h,1.0);}

const stars=Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+0.5,speed:Math.random()*1.5+0.3}));
function moveStars(){for(const s of stars){s.y+=s.speed;if(s.y>H){s.y=0;s.x=Math.random()*W;}}}
function drawStars(){ctx.fillStyle='#ffffff';for(const s of stars){ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}}

function draw(){
  ctx.save();
  if(screenShake>0){
    ctx.translate((Math.random()-0.5)*screenShake,(Math.random()-0.5)*screenShake);
  }
  if(giantMeteors.length && giantMeteors.some(gm=>gm.shakeTimer > 0)){
    const shakeX = (Math.random() - 0.5) * 12;
    const shakeY = (Math.random() - 0.5) * 12;
    ctx.translate(shakeX, shakeY);
  }

  if(IMG['bg']&&state==='play'){ctx.drawImage(IMG['bg'],0,0,W,H);}
  else{ctx.fillStyle='#08081a';ctx.fillRect(0,0,W,H);drawStars();}

  if(state==='select')drawSelect();
  else if(state==='shop')drawShop();
  else if(state==='loading')drawLoading();
  else if(state==='gameover')drawGameOver();
  else if(state==='win')drawWin();
  else if(state==='settings'){drawGameplay();drawSettingsOverlay();}
  else{
    drawGameplay();
    if(state==='paused')drawPauseOverlay();
  }
  ctx.restore();
}

function drawSelect(){
  const roomImgKey=ROOM_IMG_KEYS[currentRoom%ROOM_IMG_KEYS.length];
  if(IMG[roomImgKey]){
    const img=IMG[roomImgKey],iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
    if(iw&&ih){const sc=Math.max(W/iw,H/ih),dw=iw*sc,dh=ih*sc;ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);ctx.fillStyle='rgba(4,4,16,0.35)';ctx.fillRect(0,0,W,H);}
  }

  const pts=roomNodePoints();
  const startLv=roomStartLevel(currentRoom);

  ctx.lineWidth=Math.max(3,Math.floor(U*0.09));
  for(let i=0;i<pts.length-1;i++){
    ctx.beginPath();
    ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[i+1].x,pts[i+1].y);
    ctx.strokeStyle=(startLv+i+1<=unlockedLevel)?'#ffcc33':'#555566';
    ctx.stroke();
  }

  const roomCount=roomLevelCount(currentRoom);
  const nodeR=Math.max(13,Math.floor(U*0.26));
  for(let i=0;i<roomCount;i++){
    const lv=startLv+i,isBoss=(i===roomCount-1);
    const locked=lv>unlockedLevel;
    const p=pts[i],r=isBoss?nodeR*1.35:nodeR;
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.fillStyle=locked?'#30303a':(isBoss?'#a83210':'#2d5fc3');ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle=locked?'#777788':(isBoss?'#ff8822':'#8fb8ff');ctx.stroke();
    
    const fs=Math.max(12,Math.floor(r*0.6));
    if(locked){
      drawText('🔒',p.x,p.y-fs/2-2,Math.max(14,fs),'#dddddd','center',true);
      drawText('დაბლოკილია',p.x,p.y+r+4,Math.max(8,Math.floor(U*0.13)),'#d0d0d8','center',true);
    }else{
      if(isBoss)drawText('🔥',p.x,p.y-r-22,20,'#ff9966','center');
      drawText(String(lv),p.x,p.y-fs/2,fs,'#ffffff','center',true);
    }
  }

  drawText('⚔ WAR ⚔',W/2,10,24,'#ffdd44','center',true);
  drawText(`ოთახი ${currentRoom+1}/${TOTAL_ROOMS}  ·  დონეები ${startLv}-${startLv+roomCount-1}`,W/2,38,15,'#ffffff','center',true);
  const req=roomLoadout(currentRoom);
  const reqShip=SHIPS.find(s=>s.id===req.ship)||SHIPS[0];
  const reqWeapon=WEAPONS.find(w=>w.id===req.weapon)||WEAPONS[0];
  drawText(`ამ ოთახის აღჭურვა: ${reqShip.name} + ${reqWeapon.name}`,W/2,58,11,'#bfe8ff','center',true);
  if(!loadoutReady(currentRoom)){
    drawText('საჭიროა შესაბამისი ხომალდისა და იარაღის არჩევა',W/2,74,10,'#ffb0a0','center',true);
  }
  if(selectNotice&&now()-selectNoticeTimer<2200){
    const nw=ctx.measureText(selectNotice).width+28;
    drawRect(W/2-nw/2,H-62,nw,28,'#000000cc',7);
    drawText(selectNotice,W/2,H-56,12,'#ffdc55','center',true);
  }

  drawBtn(BTN_SHOP,'#7a5200','🛒 მაღაზია');
  drawBtn(BTN_SETTINGS_MENU,'#303050','⚙');
  drawText(`⛃ ${coinBalance}`,BTN_SHOP.x+BTN_SHOP.w,BTN_SHOP.y+BTN_SHOP.h+6,14,'#ffd700','right',true);

  const prevOk=currentRoom>0,nextOk=currentRoom<TOTAL_ROOMS-1;
  ctx.globalAlpha=prevOk?1:0.3;
  ctx.beginPath();ctx.arc(BTN_ROOM_PREV.x+BTN_ROOM_PREV.w/2,BTN_ROOM_PREV.y+BTN_ROOM_PREV.h/2,BTN_ROOM_PREV.w/2,0,Math.PI*2);ctx.fillStyle='#000000aa';ctx.fill();
  drawText('◀',BTN_ROOM_PREV.x+BTN_ROOM_PREV.w/2,BTN_ROOM_PREV.y+BTN_ROOM_PREV.h*0.22,Math.floor(BTN_ROOM_PREV.w*0.5),'#fff','center',true);
  ctx.globalAlpha=nextOk?1:0.3;
  ctx.beginPath();ctx.arc(BTN_ROOM_NEXT.x+BTN_ROOM_NEXT.w/2,BTN_ROOM_NEXT.y+BTN_ROOM_NEXT.h/2,BTN_ROOM_NEXT.w/2,0,Math.PI*2);ctx.fillStyle='#000000aa';ctx.fill();
  drawText('▶',BTN_ROOM_NEXT.x+BTN_ROOM_NEXT.w/2,BTN_ROOM_NEXT.y+BTN_ROOM_NEXT.h*0.22,Math.floor(BTN_ROOM_NEXT.w*0.5),'#fff','center',true);
  ctx.globalAlpha=1;

  ctx.save();
  ctx.font = 'bold italic 16px Arial';
  ctx.fillStyle = '#00bfff';
  ctx.shadowColor = '#002244';
  ctx.shadowBlur = 8;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  ctx.fillText('ავტორი: ლ. ბირკაძე', W - 16, H - 12);
  ctx.restore();
}

function drawShop(){
  ctx.fillStyle='#08081a';ctx.fillRect(0,0,W,H);drawStars();
  ctx.fillStyle='rgba(4,4,16,0.55)';ctx.fillRect(0,0,W,H);

  drawText('🛒 მაღაზია',W/2,14,24,'#ffdd44','center',true);
  drawText(`⛃ ბალანსი: ${coinBalance}`,W/2,44,16,'#ffd700','center',true);
  drawBtn(BTN_SETTINGS_MENU,'#303050','⚙');

  ctx.fillStyle='#333333cc';ctx.beginPath();ctx.roundRect(BTN_SHOP_BACK.x,BTN_SHOP_BACK.y,BTN_SHOP_BACK.w,BTN_SHOP_BACK.h,8);ctx.fill();
  drawText('◀ უკან',BTN_SHOP_BACK.x+BTN_SHOP_BACK.w/2,BTN_SHOP_BACK.y+8,13,'#fff','center',true);

  const tabY=66,tabH=30,tabGap=8,tabW=Math.floor((W-24-tabGap)/2);
  BTN_SHOP_TAB1={x:12,y:tabY,w:tabW,h:tabH};
  BTN_SHOP_TAB2={x:12+tabW+tabGap,y:tabY,w:tabW,h:tabH};
  drawBtn(BTN_SHOP_TAB1,shopTab==='ships'?'#2255aa':'#333344','🚀 ხომალდები');
  drawBtn(BTN_SHOP_TAB2,shopTab==='weapons'?'#2255aa':'#333344','🔫 იარაღები');

  SHOP_CARDS=[];
  const top=tabY+tabH+14;

  if(shopTab==='ships'){
    const cardH=Math.floor((H-top-10)/SHIPS.length), cardW=W-24, cx=12;
    for(let i=0;i<SHIPS.length;i++){
      const ship=SHIPS[i];
      const cy=top+i*cardH;
      const owned=ownedShips.indexOf(ship.id)!==-1;
      const equipped=equippedShip===ship.id;

      drawRect(cx,cy+4,cardW,cardH-8,equipped?'#1a3a1acc':'#141428cc',10);
      ctx.strokeStyle=equipped?'#33ff66':'#4444aa';ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(cx,cy+4,cardW,cardH-8,10);ctx.stroke();

      const imgSize=cardH-24;
      // Give every shop ship one stable visual box so their size does not
      // jump between cards because the PNGs have different aspect ratios.
      drawSpriteStable(ship.img,cx+14,cy+16,imgSize,imgSize);

      const textX=cx+14+imgSize+16;
      drawText(ship.name,textX,cy+10,15,'#ffffff','left',true);
      drawText(ship.powerDesc||'',textX,cy+30,10,'#9fe0ff','left');
      const priceTxt=ship.price===0?'უფასო':`ფასი: ${ship.price} ⛃`;

let fullscreenAttempted=false;

  if(fullscreenAttempted)return;

  if(root.requestFullscreen){
    root.requestFullscreen().then(()=>{
      if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('portrait').catch(()=>{});

function openSettings(fromState){
  settingsReturnState=fromState;
  state='settings';
  stopLaserSound();
}
function closeSettings(){
  applyAudioSettings();
  if(settingsReturnState==='play'&&gameSettings.musicVolume>0)startMusic();
  state=settingsReturnState;
}
function updateSlider(key,mx,control){
  gameSettings[key]=Math.max(0,Math.min(1,(mx-control.x+10)/(control.w-20)));
  saveSettings();applyAudioSettings();
  if(key==='musicVolume'&&gameSettings[key]<=0)stopMusic();
  else if(key==='musicVolume'&&settingsReturnState==='play')startMusic();
}

function handleTap(mx,my){
  if(state==='settings'){
    if(SETTINGS_CONTROLS.close&&pointInRect(mx,my,SETTINGS_CONTROLS.close)){playSound('ui_click');closeSettings();return;}
    for(const key of ['sfxVolume','musicVolume']){
      const control=SETTINGS_CONTROLS[key];
      if(control&&pointInRect(mx,my,control)){updateSlider(key,mx,control);return;}
    }
    if(SETTINGS_CONTROLS.vibration&&pointInRect(mx,my,SETTINGS_CONTROLS.vibration)){
      gameSettings.vibration=!gameSettings.vibration;saveSettings();playSound('ui_click');return;
    }
    if(SETTINGS_CONTROLS.meteorRate&&pointInRect(mx,my,SETTINGS_CONTROLS.meteorRate)){
      gameSettings.meteorRate=gameSettings.meteorRate===2?1:2;saveSettings();playSound('ui_click');return;
    }
    const qualityOrder=['low','medium','high'];
    if(SETTINGS_CONTROLS.graphicsPrev&&pointInRect(mx,my,SETTINGS_CONTROLS.graphicsPrev)){
      const current=Math.max(0,qualityOrder.indexOf(gameSettings.graphicsQuality));
      gameSettings.graphicsQuality=qualityOrder[(current+qualityOrder.length-1)%qualityOrder.length];
      saveSettings();playSound('ui_click');return;
    }
    if(SETTINGS_CONTROLS.graphicsNext&&pointInRect(mx,my,SETTINGS_CONTROLS.graphicsNext)){
      const current=Math.max(0,qualityOrder.indexOf(gameSettings.graphicsQuality));
      gameSettings.graphicsQuality=qualityOrder[(current+1)%qualityOrder.length];
      saveSettings();playSound('ui_click');return;
    }
    return;
  }
  if(state==='play'||state==='paused'){
    if(pointInRect(mx,my,BTN_PAUSE)){playSound('ui_click');const goingToPause=state!=='paused';state=goingToPause?'paused':'play';if(goingToPause)stopLaserSound();return;}
    if(pointInRect(mx,my,BTN_EXIT)){playSound('ui_click');stopMusic();stopLaserSound();state='select';return;}
    if(pointInRect(mx,my,BTN_SETTINGS)){playSound('ui_click');openSettings(state);return;}
    if(state==='play'&&pointInRect(mx,my,BTN_POWER)){activateSuperPower();return;}
    if(state==='paused'&&pointInRect(mx,my,BTN_MENU)){playSound('ui_click');stopMusic();stopLaserSound();state='select';return;}
    if(pointInRect(mx,my,BTN_SPREAD)){playSound('ui_click');spreadMode=!spreadMode;return;}
  }
  if(state==='shop'){
    if(pointInRect(mx,my,BTN_SETTINGS_MENU)){playSound('ui_click');openSettings('shop');return;}
    if(pointInRect(mx,my,BTN_SHOP_BACK)){playSound('ui_click');state='select';return;}
    if(BTN_SHOP_TAB1&&pointInRect(mx,my,BTN_SHOP_TAB1)){playSound('ui_click');shopTab='ships';return;}
    if(BTN_SHOP_TAB2&&pointInRect(mx,my,BTN_SHOP_TAB2)){playSound('ui_click');shopTab='weapons';return;}
    for(const card of SHOP_CARDS){
      if(pointInRect(mx,my,card.btn)){
        if(card.equipped)return;
        if(card.type==='ship'){
          if(card.owned){
            playSound('ui_click');
            equippedShip=card.item.id;saveEquipped(equippedShip);
          }else if(coinBalance>=card.item.price){
            coinBalance-=card.item.price;saveCoins(coinBalance);
            ownedShips.push(card.item.id);saveOwnedShips(ownedShips);
            equippedShip=card.item.id;saveEquipped(equippedShip);
            playSound('coin_pickup');
          }else{
            playSound('ui_click');
          }
        }else{
          if(card.owned){
            playSound('ui_click');
            equippedWeapon=card.item.id;saveEquippedWeapon(equippedWeapon);
          }else if(coinBalance>=card.item.price){
            coinBalance-=card.item.price;saveCoins(coinBalance);
            ownedWeapons.push(card.item.id);saveOwnedWeapons(ownedWeapons);
            equippedWeapon=card.item.id;saveEquippedWeapon(equippedWeapon);
            playSound('coin_pickup');
          }else{
            playSound('ui_click');
          }
        }
        return;
      }
    }
    return;
  }
  if(state==='select'){
    if(travel)return;
    if(pointInRect(mx,my,BTN_SETTINGS_MENU)){playSound('ui_click');openSettings('select');return;}
    if(pointInRect(mx,my,BTN_SHOP)){playSound('ui_click');state='shop';return;}
    if(pointInRect(mx,my,BTN_ROOM_PREV)){if(currentRoom>0){playSound('ui_click');currentRoom--;}return;}
    if(pointInRect(mx,my,BTN_ROOM_NEXT)){if(currentRoom<TOTAL_ROOMS-1){playSound('ui_click');currentRoom++;}return;}
    const pts=roomNodePoints();
    const startLv=roomStartLevel(currentRoom);
    const nodeR=Math.max(13,Math.floor(U*0.26));
    const roomCount=roomLevelCount(currentRoom);
    for(let i=0;i<roomCount;i++){
      const lv=startLv+i,isBoss=(i===roomCount-1),r=isBoss?nodeR*1.35:nodeR,p=pts[i];
      const dx=mx-p.x,dy=my-p.y;
      if(dx*dx+dy*dy<=r*r){
        playSound('ui_click');
        if(lv>unlockedLevel){
          selectNotice='დაბლოკილია — ჯერ წინა დონეები უნდა გაიარო';
          selectNoticeTimer=now();
          return;
        }
        const requiredRoom=roomForLevel(lv);
        if(!loadoutReady(requiredRoom)){
          const req=roomLoadout(requiredRoom);
          const reqShip=SHIPS.find(s=>s.id===req.ship)||SHIPS[0];
          const reqWeapon=WEAPONS.find(w=>w.id===req.weapon)||WEAPONS[0];
          selectNotice=`საჭიროა: ${reqShip.name} + ${reqWeapon.name}`;
          selectNoticeTimer=now();
          return;
        }
        resetGame(lv);
        return;
      }
    }
  }
  if(state==='gameover'||state==='win'){state='select';}
}

function isGameplayControl(x,y){
  return [BTN_PAUSE,BTN_EXIT,BTN_SETTINGS,BTN_SPREAD,BTN_POWER].some(btn=>btn&&pointInRect(x,y,btn));
}
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  requestGameFullscreen();
  const p=getTouchPos(e);
  touching=true;
  shipPointerActive=state==='play'&&!isGameplayControl(p.x,p.y);
  if(shipPointerActive){touchX=p.x;touchY=p.y;}
  handleTap(p.x,p.y);
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  const p=getTouchPos(e);
  if(shipPointerActive&&state==='play'){touchX=p.x;touchY=p.y;}
  if(state==='settings'&&touching){
    for(const key of ['sfxVolume','musicVolume']){
      const control=SETTINGS_CONTROLS[key];
      if(control&&p.y>=control.y-10&&p.y<=control.y+control.h+10){updateSlider(key,p.x,control);break;}
    }
  }
},{passive:false});

 canvas.addEventListener('mousedown',e=>{

 });

  if(player){
    player.rect.w=PL_W;player.rect.h=PL_H;player.zoneTop=Math.floor(H*0.55);
    const halfW=player.rect.w/2,halfH=player.rect.h/2;
    player.rect.x=Math.max(0,Math.min(W-player.rect.w,player.rect.x));
    const minY=Math.max(0,Math.min(H-player.rect.h,player.zoneTop));
    player.rect.y=Math.max(minY,Math.min(H-player.rect.h,player.rect.y));
  }
});

touchX=W/2;touchY=H*0.75;
let lastTs=performance.now(),fpsClock=lastTs,fpsFrames=0,fpsValue=0;
function loop(ts){
  const t=ts||performance.now();const dt=Math.min(50,t-lastTs);lastTs=t;
  fpsFrames++;
  if(t-fpsClock>=500){fpsValue=Math.round(fpsFrames*1000/(t-fpsClock));fpsFrames=0;fpsClock=t;}
  if(state==='play')updateGame();
  updateEffects();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
